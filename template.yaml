AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Occasions address book - households, occasions, labels and envelopes, SES invitations, Cognito sign-in.

Parameters:
  AddressCheckParameter:
    Type: String
    Default: /occasion-address-book/google-address-validation
    Description: SSM SecureString parameter holding the Google API key for the Address Validation API. Address checks stay off until it exists.
    AllowedPattern: ^/[A-Za-z0-9_./-]+$
  AllowedEmails:
    Type: String
    Default: '*'
    Description: Comma-separated emails allowed to use the app, or * for anyone with an account.
  SesIdentity:
    Type: String
    AllowedPattern: '^[^\s]+$'
    Description: The SES identity (verified domain or email address) Cognito sends sign-in emails through.
  SenderEmail:
    Type: String
    AllowedPattern: '^[^\s@]+@[^\s@]+\.[^\s@]+$'
    Description: SES-verified address (or an address on an SES-verified domain) that invitations are sent from.
  SesConfigurationSet:
    Type: String
    Default: ''
    Description: Optional SES configuration set name for delivery tracking.
  DevOrigin:
    Type: String
    Default: http://localhost:8080
    Description: Extra origin allowed to call the API, for running the website locally.
  AppDomain:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[a-z0-9.-]+\.[a-z]{2,}$'
    Description: Optional custom domain for the website.
  AppAltDomain:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[a-z0-9.-]+\.[a-z]{2,}$'
    Description: Optional second domain (e.g. www.), redirected to AppDomain.
  AppCertificateArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:aws[a-zA-Z-]*:acm:us-east-1:\d{12}:certificate/.+$'
    ConstraintDescription: must be an ACM certificate ARN in us-east-1 (CloudFront only uses certificates from that region)
    Description: ACM certificate in us-east-1 covering the custom domain(s). Required when AppDomain is set.

Conditions:
  HasConfigSet: !Not [!Equals [!Ref SesConfigurationSet, '']]
  HasAppDomain: !Not [!Equals [!Ref AppDomain, '']]
  HasAltDomain: !Not [!Equals [!Ref AppAltDomain, '']]

Rules:
  CustomDomainNeedsCertificate:
    RuleCondition: !Not [!Equals [!Ref AppDomain, '']]
    Assertions:
      - Assert: !Not [!Equals [!Ref AppCertificateArn, '']]
        AssertDescription: Set AppCertificateArn (an ACM certificate in us-east-1) when using a custom domain.

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    MemorySize: 256
    CodeUri: backend/
    Environment:
      Variables:
        TABLE_NAME: !Ref Table
        FILES_BUCKET: !Ref FilesBucket
        MEDIA_BUCKET: !Ref MediaBucket
        ALLOWED_EMAILS: !Ref AllowedEmails
        SENDER_EMAIL: !Ref SenderEmail
        SES_CONFIGURATION_SET: !Ref SesConfigurationSet
        ADDRESS_CHECK_PARAMETER: !Ref AddressCheckParameter
        APP_URL: !If [HasAppDomain, !Sub 'https://${AppDomain}', !Sub 'https://${Distribution.DomainName}']

Resources:
  # ---------- Data ----------
  # Single table. Address-update link tokens carry a "ttl" attribute so DynamoDB removes them after they expire.
  Table:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  # ---------- Profile photos ----------
  # Private and encrypted; the browser uploads and views through short-lived signed links.
  FilesBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: CleanUp
            Status: Enabled
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 1 }
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - !Sub https://${Distribution.DomainName}
              - !Ref DevOrigin
              - !If [HasAppDomain, !Sub 'https://${AppDomain}', !Ref AWS::NoValue]
              - !If [HasAltDomain, !Sub 'https://${AppAltDomain}', !Ref AWS::NoValue]
            AllowedMethods: [PUT, GET]
            AllowedHeaders: [content-type]
            MaxAge: 3000

  FilesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FilesBucket
      PolicyDocument:
        Statement:
          - Sid: HttpsOnly
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt FilesBucket.Arn
              - !Sub ${FilesBucket.Arn}/*
            Condition:
              Bool: { 'aws:SecureTransport': 'false' }

  # ---------- Pictures in designed invitations and emails ----------
  # Uploaded through short-lived signed links; readable by anyone through CloudFront at
  # https://<site>/media/<random name>, because guests' mail apps have to load them.
  MediaBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: ['*']   # uploads need a signed link anyway
            AllowedMethods: [PUT]
            AllowedHeaders: [content-type]
            MaxAge: 3000

  MediaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MediaBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub ${MediaBucket.Arn}/media/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}
          - Sid: HttpsOnly
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt MediaBucket.Arn
              - !Sub ${MediaBucket.Arn}/*
            Condition:
              Bool: { 'aws:SecureTransport': 'false' }

  # ---------- Sign-in (Cognito) ----------
  # Invite-only: people are added with scripts/invite-user.sh and get an email with a temporary
  # password. Sign-in emails go through SES in the app's style (CognitoMessageFunction).
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub ${AWS::StackName}-users
      UserPoolTier: LITE
      DeletionProtection: ACTIVE
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      UsernameConfiguration: { CaseSensitive: false }
      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate: [email]   # the old address stays until the new one is confirmed
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: false
          RequireUppercase: false
          RequireNumbers: false
          RequireSymbols: false
          TemporaryPasswordValidityDays: 30
      MfaConfiguration: 'OPTIONAL'
      EnabledMfas: [SOFTWARE_TOKEN_MFA]
      AccountRecoverySetting:
        RecoveryMechanisms:
          - { Name: verified_email, Priority: 1 }
      EmailConfiguration:
        EmailSendingAccount: DEVELOPER
        SourceArn: !Sub arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/${SesIdentity}
        From: !Sub Occasions Address Book <${SenderEmail}>
        ConfigurationSet: !If [HasConfigSet, !Ref SesConfigurationSet, !Ref AWS::NoValue]
      LambdaConfig:
        CustomMessage: !GetAtt CognitoMessageFunction.Arn
        PostConfirmation: !GetAtt CognitoPostConfirmationFunction.Arn

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: web
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AuthSessionValidity: 5
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits: { AccessToken: minutes, IdToken: minutes, RefreshToken: days }

  # Builds the invitation, password-reset and email-change emails in the app's style.
  CognitoMessageFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/cognito-message.handler
      Timeout: 5

  # Emails "your password was changed" after a Forgot-password reset.
  CognitoPostConfirmationFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/cognito-post-confirmation.handler
      Timeout: 10
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref Table }
        - Statement:
            - Effect: Allow
              Action: ses:SendEmail
              Resource:
                - !Sub arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/*
                - !If
                  - HasConfigSet
                  - !Sub arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:configuration-set/${SesConfigurationSet}
                  - !Ref AWS::NoValue

  CognitoPostConfirmationPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt CognitoPostConfirmationFunction.Arn
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

  CognitoPostConfirmationLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${CognitoPostConfirmationFunction}
      RetentionInDays: 30

  CognitoMessagePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt CognitoMessageFunction.Arn
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

  CognitoMessageLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${CognitoMessageFunction}
      RetentionInDays: 30

  # ---------- API ----------
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 20
      CorsConfiguration:
        AllowOrigins:
          - !Sub https://${Distribution.DomainName}
          - !Ref DevOrigin
          - !If [HasAppDomain, !Sub 'https://${AppDomain}', !Ref AWS::NoValue]
          - !If [HasAltDomain, !Sub 'https://${AppAltDomain}', !Ref AWS::NoValue]
        AllowHeaders: [authorization, content-type, x-book]   # x-book: which address book (own or shared)
        AllowMethods: [GET, POST, PUT, DELETE, OPTIONS]
        MaxAge: 600

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/api.handler
      Timeout: 60 # an invitation batch sends up to 25 emails
      Environment:
        Variables:
          COGNITO_USER_POOL_ID: !Ref UserPool
          COGNITO_CLIENT_ID: !Ref UserPoolClient
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - S3CrudPolicy: { BucketName: !Ref FilesBucket }
        - S3WritePolicy: { BucketName: !Ref MediaBucket }
        - Statement:
            - Effect: Allow   # Google API key for address checks
              Action: ssm:GetParameter
              Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${AddressCheckParameter}
        - Statement:
            - Effect: Allow   # sharing: check whether someone has an account, and invite them if not
              Action: [cognito-idp:AdminCreateUser, cognito-idp:AdminGetUser]
              Resource: !GetAtt UserPool.Arn
        - Statement:
            - Effect: Allow
              Action: ses:SendEmail
              Resource:
                - !Sub arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/*
                - !If
                  - HasConfigSet
                  - !Sub arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:configuration-set/${SesConfigurationSet}
                  - !Ref AWS::NoValue
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY

  ApiLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ApiFunction}
      RetentionInDays: 30

  # ---------- Website ----------
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  WebOac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-web
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Metadata:
      cfn-lint:
        config:
          ignore_checks: [W1030] # AppCertificateArn is only used when AppDomain is set, and the Rule requires it then
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Occasions address book
        DefaultRootObject: index.html
        Aliases: !If
          - HasAppDomain
          - !If [HasAltDomain, [!Ref AppDomain, !Ref AppAltDomain], [!Ref AppDomain]]
          - !Ref AWS::NoValue
        ViewerCertificate: !If
          - HasAppDomain
          - AcmCertificateArn: !Ref AppCertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - !Ref AWS::NoValue
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Origins:
          - Id: web
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt WebOac.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
          - Id: media
            DomainName: !GetAtt MediaBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt WebOac.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        CacheBehaviors:
          - PathPattern: media/*
            TargetOriginId: media
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6          # Managed-CachingOptimized
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # Managed-SecurityHeadersPolicy
        DefaultCacheBehavior:
          TargetOriginId: web
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6          # Managed-CachingOptimized
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # Managed-SecurityHeadersPolicy
          FunctionAssociations: !If
            - HasAltDomain
            - - EventType: viewer-request
                FunctionARN: !GetAtt AltDomainRedirect.FunctionMetadata.FunctionARN
            - !Ref AWS::NoValue
        CustomErrorResponses:
          - { ErrorCode: 403, ResponseCode: 200, ResponsePagePath: /index.html }
          - { ErrorCode: 404, ResponseCode: 200, ResponsePagePath: /index.html }

  # Sends visitors on the second domain (e.g. www.) to the main one, so everyone uses one
  # address and only has to sign in once.
  AltDomainRedirect:
    Type: AWS::CloudFront::Function
    Condition: HasAltDomain
    Properties:
      Name: !Sub ${AWS::StackName}-alt-domain-redirect
      AutoPublish: true
      FunctionConfig:
        Comment: Redirect the alternate domain to the main domain
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        function handler(event) {
          var request = event.request;
          var host = request.headers.host ? request.headers.host.value : '';
          if (host === '${AppDomain}') return request;
          var parts = [];
          var qs = request.querystring;
          for (var key in qs) {
            var item = qs[key];
            var values = item.multiValue ? item.multiValue : [item];
            for (var i = 0; i < values.length; i++) {
              parts.push(encodeURIComponent(key) + (values[i].value === '' ? '' : '=' + encodeURIComponent(values[i].value)));
            }
          }
          return {
            statusCode: 301,
            statusDescription: 'Moved Permanently',
            headers: { location: { value: 'https://${AppDomain}' + request.uri + (parts.length ? '?' + parts.join('&') : '') } },
          };
        }

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub ${WebBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}

Outputs:
  AppUrl:
    Description: Website URL
    Value: !If [HasAppDomain, !Sub 'https://${AppDomain}', !Sub 'https://${Distribution.DomainName}']
  CloudFrontUrl:
    Description: The CloudFront address (point your domain's DNS here)
    Value: !GetAtt Distribution.DomainName
  ApiUrl:
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  WebBucketName:
    Value: !Ref WebBucket
  FilesBucketName:
    Description: Private bucket holding profile photos
    Value: !Ref FilesBucket
  MediaBucketName:
    Description: Pictures used in designed invitations and emails
    Value: !Ref MediaBucket
  DistributionId:
    Value: !Ref Distribution
  TableName:
    Value: !Ref Table
